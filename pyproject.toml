[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillcorpus"
version = "0.1.1"
description = "Evidence-first local converter: documents → citable Agent Skill packs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SkillCorpus contributors" }]
keywords = ["agent-skills", "rag", "pdf", "evidence", "citations"]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "pypdf>=4.0"]

[project.scripts]
skillcorpus = "skillcorpus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["skillcorpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
