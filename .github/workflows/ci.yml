name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check skillcorpus tests
      - name: Pytest
        run: pytest tests/ -q
      - name: Fixture smoke pack
        run: |
          skillcorpus pack fixtures/rate_limiter/handbook.md \
            -o /tmp/skillcorpus-smoke --name "Rate Limiter Handbook"
          skillcorpus validate /tmp/skillcorpus-smoke
          skillcorpus benchmark --skill /tmp/skillcorpus-smoke \
            --questions fixtures/questions/rate_limiter.json --json > /tmp/bench.json
          python -c 'import json; r=json.load(open("/tmp/bench.json")); assert r["evidence_localization_rate"]>=0.8; assert r["no_answer_correct_rate"]==1.0'
      - name: Build sdist/wheel
        run: |
          python -m pip install -U build
          python -m build
          python -m pip install dist/*.whl --force-reinstall
          skillcorpus --version
